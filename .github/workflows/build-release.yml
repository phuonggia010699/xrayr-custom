name: build-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false

      - name: Upgrade xray-core and tidy
        run: |
          go version
          go get github.com/xtls/xray-core@v1.260327.0
          go mod tidy

      - name: Build
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -trimpath -ldflags "-s -w" -o dist/XrayR-linux-$arch .
          done
          cp release/config/config.yml.example dist/config.yml.template
          (cd dist && sha256sum XrayR-linux-* > SHA256SUMS)
          ls -lh dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          files: |
            dist/XrayR-linux-amd64
            dist/XrayR-linux-arm64
            dist/config.yml.template
            dist/SHA256SUMS
